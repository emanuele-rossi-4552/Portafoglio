name: Aggiorna dati

# Scarica i dati di mercato con le stesse regole degli script (FRED, Yahoo, multpl) e scrive dati/dati.json.
# Parte da sola nei giorni di borsa dopo la chiusura, e a mano dal pulsante «Aggiorna» dell'app
# (o da GitHub: scheda Actions > Aggiorna dati > Run workflow).
on:
  schedule:
    - cron: "50 17 * * 1-5"
  workflow_dispatch:
    inputs:
      sezioni:
        description: "Sezioni da aggiornare (separate da virgola): pendolo,mercato,prezzi,etf,graham. Vuoto = tutte."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: aggiorna-dati
  cancel-in-progress: false

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yfinance requests
      - name: Scarica i dati
        env:
          SEZIONI: ${{ github.event.inputs.sezioni }}
        run: |
          if [ -n "$SEZIONI" ]; then
            python scripts/aggiorna_dati.py --sezioni "$SEZIONI"
          else
            python scripts/aggiorna_dati.py --graham-ogni 6
          fi
      - name: Salva dati.json
        run: |
          git config user.name "aggiorna-dati"
          git config user.email "actions@users.noreply.github.com"
          git add dati/dati.json dati/cache_ticker.json
          if git diff --cached --quiet; then
            echo "Nessun cambiamento."
          else
            git commit -m "Dati di mercato $(date -u +%Y-%m-%d)"
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            git push
          fi
