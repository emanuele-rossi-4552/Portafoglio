<style>
/* Layout: una colonna da telefono, barra di navigazione in basso, schede con un solo compito ciascuna. */
:root {
  --bg: #EDF0F3; --surface: #FFFFFF; --surface2: #F5F7F9; --ink: #111C26; --ink2: #475766; --ink3: #6E7C8A;
  --line: #D8DFE6; --accent: #1D4E7E; --accent-soft: #DCE8F3; --on-accent: #FFFFFF;
  --buy: #0F6B4B; --buy-bg: #DFF2E9; --sell: #A93626; --sell-bg: #FAE5E1;
  --warn: #7F5200; --warn-bg: #FAEFD0; --ok: #3F6B57; --ok-bg: #E6F0EB;
  --fear: #3C78B8; --greed: #CB6E1F; --shadow: 0 1px 2px rgba(17,28,38,.06), 0 4px 14px rgba(17,28,38,.05);
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0D1319; --surface: #151E27; --surface2: #1B2632; --ink: #E7EDF2; --ink2: #A8B6C3; --ink3: #8493A1;
  --line: #27343F; --accent: #86B8E8; --accent-soft: #1B3249; --on-accent: #0D1319;
  --buy: #62D3A3; --buy-bg: #12342A; --sell: #F2917F; --sell-bg: #3B1E1A;
  --warn: #E6BB62; --warn-bg: #362B12; --ok: #8FC3A8; --ok-bg: #16302A;
  --fear: #6EA8E2; --greed: #F0A35B; --shadow: none; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0D1319; --surface: #151E27; --surface2: #1B2632; --ink: #E7EDF2; --ink2: #A8B6C3; --ink3: #8493A1;
  --line: #27343F; --accent: #86B8E8; --accent-soft: #1B3249; --on-accent: #0D1319;
  --buy: #62D3A3; --buy-bg: #12342A; --sell: #F2917F; --sell-bg: #3B1E1A;
  --warn: #E6BB62; --warn-bg: #362B12; --ok: #8FC3A8; --ok-bg: #16302A;
  --fear: #6EA8E2; --greed: #F0A35B; --shadow: none; color-scheme: dark; }
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.4;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 84px; -webkit-text-size-adjust: 100%; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
#app { max-width: 640px; margin: 0 auto; }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); padding: 12px 0 8px;
  display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.top h1 { font-size: 20px; font-weight: 600; margin: 0; letter-spacing: -.01em; }
.top .sub { font-size: 12px; color: var(--ink3); min-width: 0; margin-top: 1px; }
.top > div { min-width: 0; }
#btnAgg { display: inline-flex; align-items: center; gap: 6px; flex: none; }
#btnAgg svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
#btnAgg.on svg { animation: gira 1s linear infinite; }
@keyframes gira { to { transform: rotate(360deg); } }
input[type=checkbox] { accent-color: var(--accent); width: 20px; height: 20px; flex: none; }
main { display: flex; flex-direction: column; gap: 12px; padding-bottom: 8px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; box-shadow: var(--shadow); min-width: 0; }
.card > h2 { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--ink3); margin: 0 0 10px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.card > h2 .link { text-transform: none; letter-spacing: 0; font-size: 13px; }
.muted { color: var(--ink2); } .faint { color: var(--ink3); } small, .small { font-size: 12.5px; }
.num { font-variant-numeric: tabular-nums; font-feature-settings: "tnum"; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-width: 0; }
.stack { display: flex; flex-direction: column; gap: 10px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 14px; }
.kpi { min-width: 0; } .kpi .l { font-size: 12px; color: var(--ink3); } .kpi .v { font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.chip { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; font-weight: 600; letter-spacing: .02em; padding: 2px 8px; border-radius: 999px; background: var(--surface2); color: var(--ink2); white-space: nowrap; }
.chip.buy { background: var(--buy-bg); color: var(--buy); } .chip.sell { background: var(--sell-bg); color: var(--sell); }
.chip.warn { background: var(--warn-bg); color: var(--warn); } .chip.ok { background: var(--ok-bg); color: var(--ok); }
.chip.info { background: var(--accent-soft); color: var(--accent); }
button, .btn { font: inherit; font-weight: 600; font-size: 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  padding: 10px 14px; min-height: 44px; cursor: pointer; touch-action: manipulation; }
button.pri { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
button.sm { min-height: 36px; padding: 6px 12px; font-size: 13px; }
button.ghost { background: transparent; } button.danger { color: var(--sell); }
button:disabled { opacity: .45; cursor: default; }
button:focus-visible, input:focus-visible, .tab:focus-visible, .pos:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
a.link, .link { color: var(--accent); background: none; border: 0; padding: 0; min-height: 0; font-weight: 500; cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }
input, textarea { font: inherit; width: 100%; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 10px; padding: 10px 12px; min-height: 44px; }
input.px { font-family: var(--mono); text-align: right; }
label { font-size: 12.5px; color: var(--ink2); display: block; margin-bottom: 4px; }
.banner { border-radius: 12px; padding: 10px 12px; font-size: 13.5px; display: flex; gap: 10px; align-items: center; justify-content: space-between; }
.banner.warn { background: var(--warn-bg); color: var(--warn); } .banner.alert { background: var(--sell-bg); color: var(--sell); }
.banner.sim { background: var(--accent-soft); color: var(--accent); font-weight: 600; } .banner.ok { background: var(--ok-bg); color: var(--ok); }
.banner button { flex: none; }
/* operazioni suggerite */
.op { display: grid; grid-template-columns: auto 1fr auto; gap: 4px 10px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
.op:first-of-type { border-top: 0; }
.op .nm { font-weight: 600; min-width: 0; overflow-wrap: anywhere; } .op .why { grid-column: 2 / 3; font-size: 12.5px; color: var(--ink2); }
.op .amt { text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; } .op .amt small { display: block; font-weight: 400; color: var(--ink3); }
.op .go { grid-column: 3; }
.empty { text-align: center; color: var(--ink2); padding: 8px 4px; }
/* allocazione */
.alloc { padding: 12px 0; border-top: 1px solid var(--line); } .alloc:first-of-type { border-top: 0; padding-top: 0; }
.alloc .nums { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; color: var(--ink2); flex-wrap: wrap; }
.alloc .nums b { color: var(--ink); font-variant-numeric: tabular-nums; }
.act { font-weight: 600; margin-top: 4px; } .act.buy { color: var(--buy); } .act.sell { color: var(--sell); } .act.flat { color: var(--ink2); font-weight: 500; }
svg { display: block; max-width: 100%; } svg text { font-family: var(--font); fill: var(--ink3); }
/* posizioni */
.pos { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; padding: 11px 0; border-top: 1px solid var(--line); cursor: pointer; width: 100%; text-align: left; background: none; border-left: 0; border-right: 0; border-bottom: 0; border-radius: 0; font-weight: 400; min-height: 56px; }
.pos:first-of-type { border-top: 0; }
.pos .n { font-weight: 500; overflow-wrap: anywhere; } .pos .v { text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; }
.pos .s { font-size: 12.5px; color: var(--ink3); } .pos .s.r { text-align: right; font-variant-numeric: tabular-nums; }
.gl-p { color: var(--buy); } .gl-n { color: var(--sell); }
.pxrow { display: grid; grid-template-columns: 1fr 120px; gap: 10px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); }
.pxrow:first-of-type { border-top: 0; }
/* azionario */
.etf { padding: 14px 0; border-top: 1px solid var(--line); } .etf:first-of-type { border-top: 0; padding-top: 0; }
.etf .hd { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
.etf .hd b { overflow-wrap: anywhere; min-width: 0; }
.etf .hd .chip { flex: none; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; margin: 6px 0; }
.sim-chips { display: flex; gap: 8px; flex-wrap: wrap; }
.sim-chips button.on { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.note { font-size: 12.5px; color: var(--ink3); }
/* navigazione */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; background: var(--surface); border-top: 1px solid var(--line);
  display: flex; justify-content: center; padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)); }
.tabs-in { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; width: 100%; max-width: 640px; }
.tab { font: inherit; font-size: 11.5px; font-weight: 500; color: var(--ink3); background: none; border: 0; border-radius: 10px; min-height: 50px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; padding: 4px 2px; }
.tab svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.tab[aria-current="page"] { color: var(--accent); background: var(--accent-soft); font-weight: 600; }
/* foglio */
#veil { position: fixed; inset: 0; background: rgba(8,14,20,.5); z-index: 40; display: none; }
#veil.on { display: block; }
#sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 50; background: var(--surface); border-radius: 18px 18px 0 0; border: 1px solid var(--line); border-bottom: 0;
  max-height: 90%; overflow-y: auto; transform: translateY(105%); transition: transform .22s ease; display: flex; justify-content: center;
  padding: 0 max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px)); }
#sheet.on { transform: none; }
#sheet-in { width: 100%; max-width: 560px; padding: 16px 0 calc(20px + env(safe-area-inset-bottom, 0px)); }
#sheet h3 { margin: 0 0 4px; font-size: 18px; font-weight: 600; } #sheet .lead { color: var(--ink2); font-size: 13.5px; margin: 0 0 14px; }
.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; } .seg button.on { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.fields { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 10px 0; } .fields .full { grid-column: 1 / -1; }
.btns { display: flex; gap: 10px; margin-top: 14px; } .btns > * { flex: 1; }
input[type=range] { padding: 0; min-height: 36px; accent-color: var(--accent); }
#toast { position: fixed; left: 50%; bottom: calc(86px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%) translateY(20px); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-size: 14px; opacity: 0; pointer-events: none; transition: .2s; z-index: 60; max-width: calc(100% - 32px); text-align: center; }
#toast.on { opacity: 1; transform: translateX(-50%); }
pre.log { font-family: var(--mono); font-size: 12px; background: var(--surface2); border-radius: 10px; padding: 10px; overflow-x: auto; margin: 8px 0 0; }
.tbl { width: 100%; border-collapse: collapse; font-size: 13px; } .tbl th, .tbl td { text-align: right; padding: 6px 4px; border-top: 1px solid var(--line); font-variant-numeric: tabular-nums; } .tbl th:first-child, .tbl td:first-child { text-align: left; }
.tbl th { font-weight: 500; color: var(--ink3); border-top: 0; }
.wrap-x { overflow-x: auto; }
@media (prefers-reduced-motion: reduce) { #sheet, #toast { transition: none; } #btnAgg.on svg { animation: none; } }
</style>
</head>
<body>
<div id="app">
  <header class="top"><div><h1>Pendolo</h1><div class="sub" id="sub"></div></div>
    <button id="btnAgg" class="sm pri" data-act="aggiorna" aria-label="Aggiorna i dati"><svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 5v6h-6"/></svg><span>Aggiorna</span></button></header>
  <main id="vista" aria-live="polite"></main>
</div>
<nav class="tabs" aria-label="Sezioni"><div class="tabs-in" id="tabs"></div></nav>
<div id="veil"></div>
<div id="sheet" role="dialog" aria-modal="true" aria-hidden="true"><div id="sheet-in"></div></div>
<div id="toast" role="status"></div>

<script>
/* Motore di calcolo dell'app: stesse regole di Portafoglio.xlsx (Cruscotto, Parametri) e
   Bilanciamento.xlsx (Calcolo, ETF, Azioni). Funzioni pure: stato in ingresso, risultati in uscita. */
(function (root) {
  'use strict';

  var CLASSI = ['Azionario', 'Obbligazionario', 'Oro', 'Liquidità'];
  var BIG = 9e15;

  function isNum(x) { return typeof x === 'number' && isFinite(x); }
  function num(x, d) { return isNum(x) ? x : (d === undefined ? null : d); }
  function clamp(x, a, b) { return Math.min(b, Math.max(a, x)); }
  function eur0(x) { return Math.round(x).toLocaleString('it-IT'); }
  function pct0(x) { return (x * 100).toFixed(0) + '%'; }
  function fx(x, d) { return Number(x).toLocaleString('it-IT', { minimumFractionDigits: d, maximumFractionDigits: d }); }
  function floorTo(x, step) { step = Math.max(1, step || 1); return Math.floor(x / step + 1e-9) * step; }
  function ceilTo(x, step) { step = Math.max(1, step || 1); return Math.ceil(x / step - 1e-9) * step; }
  function giorniTra(isoA, dataB) {
    if (!isoA) return null;
    var a = new Date(isoA.length <= 10 ? isoA + 'T00:00:00' : isoA);
    var b = new Date(dataB.getFullYear(), dataB.getMonth(), dataB.getDate());
    var a0 = new Date(a.getFullYear(), a.getMonth(), a.getDate());
    return Math.round((b - a0) / 86400000);
  }
  function meseChiave(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); }

  /* ------------------------------------------------------------ posizioni */
  function valorePosizione(p) {
    var q = num(p.qta, 0), px = num(p.prezzo, 0);
    return p.tipo === 'Obbligazione' ? q * px / 100 : q * px;
  }

  /* ------------------------------------------------------------ curva */
  function dalleCurva(curva, x) {
    var n = curva.length, g, h;
    if (x <= curva[0].p) { g = 0; h = 0; }
    else if (x >= curva[n - 1].p) { g = n - 2; h = 1; }
    else {
      g = 0;
      for (var i = 0; i < n; i++) if (curva[i].p <= x) g = i;
      h = (x - curva[g].p) / (curva[g + 1].p - curva[g].p);
    }
    var lerp = function (k) { return curva[g][k] + (curva[g + 1][k] - curva[g][k]) * h; };
    var az = lerp('az'), ob = lerp('ob'), oro = lerp('oro');
    return { az: az, ob: ob, oro: oro, liq: 1 - az - ob - oro, segmento: g + 1, frazione: h };
  }

  /* ------------------------------------------------------------ Portafoglio */
  /* st: {snap, posizioni, pendolo:{punteggio, riferimento}, mercato:{sottoMedia}}
     opt: {punteggio} per provare un altro punteggio */
  function calcolaPortafoglio(st, opt) {
    opt = opt || {};
    var S = st.snap.portafoglio.strategia;
    var val = { 'Azionario': 0, 'Obbligazionario': 0, 'Oro': 0, 'Liquidità': 0 };
    var costoTot = 0, valTot = 0;
    st.posizioni.forEach(function (p) {
      if (p.archiviata) return;
      var v = valorePosizione(p);
      if (val[p.classe] !== undefined) val[p.classe] += v;
      valTot += v; costoTot += num(p.costo, 0);
    });
    var tot = CLASSI.reduce(function (s, c) { return s + val[c]; }, 0);
    var low = S.zonaNeutra[0], high = S.zonaNeutra[1];
    var oggiP = opt.punteggio != null ? clamp(opt.punteggio, 0, 100) : num(st.pendolo.punteggio);
    var out = { valori: val, totale: tot, costoTotale: costoTot, punteggioOggi: oggiP, ok: oggiP != null && tot > 0 };
    var pesi = {};
    CLASSI.forEach(function (c) { pesi[c] = tot > 0 ? val[c] / tot : 0; });
    out.pesi = pesi;
    if (oggiP == null || tot <= 0) { out.righe = []; return out; }

    var fuori = (oggiP <= low || oggiP >= high || low >= high);
    var rif, rifNota;
    if (opt.punteggio != null) { rif = oggiP; rifNota = 'punteggio di prova: la zona neutra non si applica'; }
    else if (fuori) { rif = oggiP; rifNota = 'fuori dalla zona neutra ' + low + '-' + high + ': vale il punteggio di oggi'; }
    else { rif = num(st.pendolo.riferimento, oggiP); rifNota = 'dentro la zona neutra ' + low + '-' + high + ': vale l’ultimo punteggio fuori dalla zona'; }
    out.punteggioRif = rif; out.riferimentoNota = rifNota; out.fuoriZona = fuori;

    // 1. curva
    var c = dalleCurva(S.curva, rif);
    var passo = { curva: { Azionario: c.az, Obbligazionario: c.ob, Oro: c.oro, 'Liquidità': c.liq } };
    // 2. pavimento della liquidità
    var liq57 = Math.max(S.pavimentoLiquidita, c.liq);
    var az57 = c.az - (liq57 - c.liq);
    // 3. freno
    var az58 = az57, frenoAttivo = false;
    var sotto = st.mercato && st.mercato.sottoMedia === true;
    if (S.frenoAttivoParametri && sotto && az57 > pesi.Azionario) { az58 = pesi.Azionario; frenoAttivo = true; }
    var liq58 = liq57 + (az57 - az58);
    // 4. tetto in euro sulla cassa
    var liq59 = S.tettoCassaEuro > 0 && tot > 0 ? Math.min(liq58, S.tettoCassaEuro / tot) : liq58;
    var ob59 = c.ob + (liq58 - liq59);
    var ob = { Azionario: az58, Obbligazionario: ob59, Oro: c.oro, 'Liquidità': liq59 };
    passo.pavimento = { Azionario: az57, Obbligazionario: c.ob, Oro: c.oro, 'Liquidità': liq57 };
    passo.freno = { Azionario: az58, Obbligazionario: c.ob, Oro: c.oro, 'Liquidità': liq58 };
    passo.tetto = ob;
    out.passi = passo; out.obiettivi = ob;
    out.freno = {
      parametroAttivo: !!S.frenoAttivoParametri, sottoMedia: st.mercato ? st.mercato.sottoMedia : null,
      scostamento: st.mercato ? st.mercato.scostamento : null, attivo: frenoAttivo
    };
    out.tettoCassaAttivo = liq59 < liq58 - 1e-12;

    // 5. fasce, segnali, importi
    var righe = [];
    var somma3 = 0;
    CLASSI.forEach(function (cl) {
      var D = ob[cl], tol = S.tolleranze[cl];
      var mn = Math.max(0, D - tol), mx = Math.min(1, D + tol);
      var W = pesi[cl];
      var G = W < mn ? W - mn : (W > mx ? W - mx : 0);
      var sign = G === 0 ? 'IN FASCIA' : ((G < 0 ? 'SOTTO ' : 'SOPRA ') +
        (Math.abs(G) >= S.scostForte ? '(forte)' : (Math.abs(G) >= S.scostLieve ? '(medio)' : '(lieve)')));
      var I = 0;
      if (cl !== 'Liquidità') { I = G === 0 ? 0 : D * tot - val[cl]; somma3 += I; }
      righe.push({ classe: cl, valore: val[cl], peso: W, obiettivo: D, min: mn, max: mx, scostamento: G, segnale: sign, daMuovere: I });
    });
    var liqRiga = righe[3]; liqRiga.daMuovere = -somma3;
    righe.forEach(function (r) {
      if (r.classe === 'Liquidità') {

  function impostaPosizione(id, campi) {
    var p = posRaw(id); if (!p) return;
    Object.assign(p, campi); p.agg = new Date().toISOString();
    if ('prezzo' in campi) p.prezzoTs = p.agg;
  }
  function sheetPos(id) {
    var p = posizioniReali().filter(function (x) { return x.id === id; })[0]; if (!p) return;
    var liq = p.tipo === 'Liquidità', obb = p.tipo === 'Obbligazione', raw = posRaw(id);
    var h = '<h3>' + esc(p.nome) + '</h3><p class="lead">' + esc(p.tipo) + (p.isin ? ' · ' + esc(p.isin) : '') + ' · valore ' + eur(Mo.valorePosizione(p)) + '</p><div class="fields">';
    if (liq) h += '<div class="full"><label for="f-q">Importo in euro</label><input id="f-q" class="px" inputmode="decimal" value="' + esc(dec(p.qta, 2)) + '"></div>';
    else {
      h += '<div><label for="f-p">' + (obb ? 'Prezzo (% del nominale)' : 'Prezzo in euro') + '</label><input id="f-p" class="px" inputmode="decimal" value="' + esc(dec(p.prezzo, obb ? 4 : (p.prezzo < 100 ? 4 : 2))) + '"></div>';
      h += '<div><label for="f-q">' + (obb ? 'Nominale in euro' : 'Quantità') + '</label><input id="f-q" class="px" inputmode="decimal" value="' + esc(obb ? dec(p.qta, 2) : String(p.qta).replace('.', ',')) + '"></div>';
    }
    h += '</div>';
    if (!liq && !obb) h += '<label style="display:flex;gap:10px;align-items:center;margin:4px 0 10px"><input type="checkbox" id="f-m" style="width:auto;min-height:0"' + (raw.prezzoManuale ? ' checked' : '') + '> Prezzo manuale: non usare quello scaricato da Yahoo</label>';
    h += '<p class="note" style="margin:0">' + (p.daMercato ? 'Prezzo di mercato del ' + dataIt(p.daMercato) + '. ' : '') + 'Costo di carico ' + eur(p.costo, 2) + '. Cambiare la quantità qui corregge solo il numero: per un acquisto o una vendita usa «Registra operazione», che aggiorna anche costo e liquidità.</p>';
    h += '<div class="btns"><button data-act="chiudi">Chiudi</button><button class="pri" data-act="salvaPos" data-id="' + id + '">Salva</button></div>';
    if (p.tipo === 'ETF' || p.tipo === 'Azione') h += '<div class="btns"><button data-act="regManuale" data-id="' + id + '">Registra operazione</button></div>';
    apriFoglio(h);
  }
  function salvaPos(id) {
    var p = posizioniReali().filter(function (x) { return x.id === id; })[0];
    var q = parseNum($('#f-q').value), px = $('#f-p') ? parseNum($('#f-p').value) : p.prezzo;
    if (q == null || q < 0 || px == null || px < 0) { toast('Controlla i numeri.'); return; }
    var campi = { qta: q };
    if (Math.abs(px - p.prezzo) > 1e-9) campi.prezzo = px;
    if ($('#f-m')) campi.prezzoManuale = $('#f-m').checked;
    impostaPosizione(id, campi);
    salvaU(); chiudiFoglio(); render(); toast('Salvato.');
  }
  function sheetOp(def, manualeId) {
    var verso = def ? def.verso : 'COMPRA', nome, isin, importo, prezzo;
    if (def) { nome = def.nome; isin = def.isin; importo = def.importo; prezzo = def.prezzo; }
    else { var p = posizioniReali().filter(function (x) { return x.id === manualeId; })[0]; nome = p.nome; isin = p.isin; importo = 500; prezzo = p.prezzo; }
    var h = '<h3>Registra operazione</h3><p class="lead">' + esc(nome) + (def ? ' — ' + esc(def.motivo) : '') + '</p>';
    h += '<div class="seg"><button data-act="verso" data-v="COMPRA" class="' + (verso === 'COMPRA' ? 'on' : '') + '">Acquisto</button><button data-act="verso" data-v="VENDI" class="' + (verso === 'VENDI' ? 'on' : '') + '">Vendita</button></div>';
    h += '<div class="fields"><div><label for="o-i">Importo eseguito (€)</label><input id="o-i" class="px" inputmode="decimal" value="' + esc(dec(importo, 2)) + '"></div>' +
      '<div><label for="o-p">Prezzo di esecuzione (€)</label><input id="o-p" class="px" inputmode="decimal" value="' + esc(dec(prezzo, 4)) + '"></div>' +
      '<div><label for="o-c">Commissione (€)</label><input id="o-c" class="px" inputmode="decimal" value="' + esc(dec(S.snap.bilanciamento.parametri.commissione || 1, 2)) + '"></div>' +
      '<div><label>Quantità</label><div id="o-q" class="mono" style="padding:11px 0;text-align:right"></div></div></div>';
    h += '<p class="note" style="margin:0">Aggiorna quantità, costo di carico, prezzo e liquidità. Usalo dopo aver eseguito l’ordine nel tuo conto.</p>';
    h += '<div class="btns"><button data-act="chiudi">Chiudi</button><button class="pri" id="o-ok" data-act="confermaOp" data-isin="' + esc(isin) + '" data-nome="' + esc(nome) + '">Registra</button></div>';
    S._verso = verso;
    apriFoglio(h, function () {
      function agg() { var i = parseNum($('#o-i').value), p = parseNum($('#o-p').value); $('#o-q').textContent = (i && p) ? qta(i / p) : '–'; }
      ['#o-i', '#o-p'].forEach(function (s) { $(s).addEventListener('input', agg); }); agg();
    });
  }
  function confermaOp(isin, nome) {
    var i = parseNum($('#o-i').value), p = parseNum($('#o-p').value), c = parseNum($('#o-c').value) || 0;
    if (!i || i <= 0 || !p || p <= 0) { toast('Controlla importo e prezzo.'); return; }
    var reali = posizioniReali(), nuove;
    try { nuove = Mo.applicaOperazione(reali, { isin: isin, verso: S._verso, importo: i, prezzo: p, commissione: c }); } catch (e) { toast('Posizione non trovata.'); return; }
    var prima = {}, adesso = new Date().toISOString();
    nuove.forEach(function (n, k) {
      var r = reali[k], raw = S.U.posizioni[k];
      if (n.qta !== r.qta || n.costo !== r.costo || !!n.archiviata !== !!r.archiviata) {
        prima[raw.id] = { qta: raw.qta, prezzo: raw.prezzo, costo: raw.costo, archiviata: !!raw.archiviata, prezzoTs: raw.prezzoTs || null };
        raw.qta = n.qta; raw.costo = n.costo; raw.archiviata = !!n.archiviata; raw.agg = adesso;
        if (n.tipo !== 'Liquidità') { raw.prezzo = n.prezzo; raw.prezzoTs = adesso; }
      }
    });
    scriviOp({ id: 'op' + Date.now().toString(36), ts: Date.now(), isin: isin, nome: nome, verso: S._verso, importo: i, prezzo: p, quantita: i / p, commissione: c, prima: prima, annullata: false });
    salvaU(); chiudiFoglio(); render(); toast(S._verso === 'COMPRA' ? 'Acquisto registrato.' : 'Vendita registrata.');
  }
  function annullaOp(id) {
    var o = S.U.ops.filter(function (x) { return x.id === id; })[0]; if (!o) return;
    Object.keys(o.prima || {}).forEach(function (pid) { var raw = posRaw(pid); if (raw) Object.assign(raw, o.prima[pid], { agg: new Date().toISOString() }); });
    o.annullata = true; scriviOp(o); render(); toast('Operazione annullata.');
  }
  function sheetPunteggio() {
    var pe = pendoloEffettivo(), z = S.snap.portafoglio.strategia.zonaNeutra, base = S.snap.portafoglio.pendolo;
    var h = '<h3>Punteggio del pendolo</h3><p class="lead">Il punteggio 0–100 è calcolato ogni giorno dallo script. Se vuoi, puoi scriverne uno tuo: vale fino al prossimo mese di dati. Fuori da ' + z[0] + '–' + z[1] + ' diventa anche il riferimento; dentro la zona neutra il riferimento resta l’ultimo punteggio fuori zona (' + dec(pe.riferimento, 1) + ').</p>' +
      '<div class="fields"><div class="full"><label for="s-p">Punteggio</label><input id="s-p" class="px" inputmode="decimal" value="' + esc(dec(pe.punteggio, 1)) + '"></div></div>' +
      '<div class="btns"><button data-act="chiudi">Chiudi</button><button class="pri" data-act="salvaPunteggio">Salva</button></div>';
    if (manualeValido() && isNum(base.punteggio)) h += '<div class="btns"><button class="ghost" data-act="ripristinaPunteggio">Torna al valore calcolato (' + dec(base.punteggio, 1) + ')</button></div>';
    apriFoglio(h);
  }
  function salvaPunteggio() {
    var v = parseNum($('#s-p').value); if (v == null || v < 0 || v > 100) { toast('Scrivi un numero da 0 a 100.'); return; }
    var z = S.snap.portafoglio.strategia.zonaNeutra, pe = pendoloEffettivo(), base = S.snap.portafoglio.pendolo;
    var fuori = v <= z[0] || v >= z[1];
    S.U.pendoloManuale = { meseBase: base.mese, punteggio: v, riferimento: fuori ? v : pe.riferimento, riferimentoMese: fuori ? new Date().toISOString().slice(0, 10) : pe.riferimentoMese, impostatoIl: new Date().toISOString() };
    salvaU(); chiudiFoglio(); render(); toast('Punteggio aggiornato.');
  }
  function sheetProva() {
    var z = S.snap.portafoglio.strategia.zonaNeutra, cur = S.prova != null ? S.prova : S.pf.punteggioOggi;
    var h = '<h3>Prova un altro punteggio</h3><p class="lead">Sposta il cursore per vedere come cambia l’azionario obiettivo. Non viene salvato niente.</p>' +
      '<div id="pv-svg"></div><div class="row" style="margin:6px 0"><b class="mono" id="pv-n"></b><span class="small muted" id="pv-t"></span></div>' +
      '<input type="range" id="pv-r" min="0" max="100" step="0.5" value="' + cur + '" aria-label="Punteggio di prova">' +
      '<div class="btns"><button data-act="chiudi">Chiudi</button><button class="pri" data-act="applicaProva">Mostra nelle schede</button></div>';
    apriFoglio(h, function () {
      var curva = S.snap.portafoglio.strategia.curva;
      function agg() {
        var v = parseFloat($('#pv-r').value), d = Mo.dalleCurva(curva, v);
        $('#pv-svg').innerHTML = curvaSvg(curva, v, v);
        $('#pv-n').textContent = dec(v, 1);
        $('#pv-t').textContent = 'azionario ' + pc(d.az, 0) + ' · obbl. ' + pc(d.ob, 0) + ' · oro ' + pc(d.oro, 1) + ' · liquidità ' + pc(d.liq, 0);
      }
      $('#pv-r').addEventListener('input', agg); agg();
    });
  }

  /* ---- importazione e backup */
  function sheetImport() {
    var h = '<h3>' + (S.U ? 'Ripristina da file' : 'Importa il portafoglio') + '</h3><p class="lead">Scegli <b>posizioni_iniziali.json</b> oppure un backup creato da questa app.</p>' +
      '<div class="fields"><div class="full"><label for="im-f">File</label><input id="im-f" type="file" accept=".json,application/json"></div>' +
      '<div class="full"><label for="im-t">Oppure incolla il contenuto</label><textarea id="im-t" rows="3" placeholder="{ &quot;tipo&quot;: &quot;pendolo-backup&quot;, … }"></textarea></div></div><div id="im-r"></div>' +
      '<div class="btns"><button data-act="chiudi">Chiudi</button><button class="pri" data-act="leggiImport">Controlla</button></div>';
    apriFoglio(h, function () {
      $('#im-f').addEventListener('change', function (e) { var f = e.target.files && e.target.files[0]; if (!f) return; var rd = new FileReader(); rd.onload = function () { $('#im-t').value = rd.result; leggiImport(); }; rd.readAsText(f); });
    });
  }
  function leggiImport() {
    var t = $('#im-t').value, j;
    try { j = JSON.parse(t); } catch (e) { $('#im-r').innerHTML = '<div class="banner alert">Il file non è un JSON valido.</div>'; return; }
    var err = validaBackup(j); if (err) { $('#im-r').innerHTML = '<div class="banner alert">' + esc(err) + '</div>'; return; }
    S._import = j;
    var tot = j.posizioni.filter(function (p) { return !p.archiviata; }).reduce(function (a, p) { return a + Mo.valorePosizione(p); }, 0);
    var nOps = (j.ops || []).filter(function (o) { return !o.annullata; }).length;
    $('#im-r').innerHTML = '<div class="banner ok"><span>' + j.posizioni.length + ' posizioni · valore ' + eur(tot) + (nOps ? ' · ' + nOps + ' operazioni registrate' : '') + (j.creato ? ' · creato il ' + dataIt(j.creato) : '') + '</span></div>' +
      (S.U ? '<div class="banner warn" style="margin-top:8px"><span>Sostituisce quello che hai ora sul telefono (' + S.U.posizioni.length + ' posizioni, ' + S.U.ops.filter(function (o) { return !o.annullata; }).length + ' operazioni).</span></div>' : '') +
      '<div class="btns"><button class="pri" data-act="confermaImport">' + (S.U ? 'Sostituisci' : 'Importa') + '</button></div>';
  }
  function confermaImport() {
    var j = S._import; if (!j) return;
    S.U = daBackup(j); S.prova = null; S.shock = 0; salvaU();
    try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) { }
    chiudiFoglio(); S.tab = 'oggi'; render(); toast('Portafoglio importato.');
  }
  function backupTesto() { return JSON.stringify(esportaStato(), null, 1); }
  function nomeBackup() { var d = new Date(); return 'pendolo-backup-' + d.getFullYear() + pad2(d.getMonth() + 1) + pad2(d.getDate()) + '.json'; }
  function copiaTesto(t, ok) {
    (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(function () { toast(ok); }).catch(function () {
      apriFoglio('<h3>Copia</h3><p class="lead">Seleziona e copia.</p><pre class="log" id="cp" style="max-height:50vh;overflow:auto;white-space:pre-wrap;word-break:break-all">' + esc(t) + '</pre><div class="btns"><button data-act="chiudi">Chiudi</button></div>', function () { var r = document.createRange(); r.selectNodeContents($('#cp')); var s = getSelection(); s.removeAllRanges(); s.addRange(r); });
    });
  }
  function salvaFile(nome, testo, tipo) {
    var blob = new Blob([testo], { type: tipo || 'application/json' });
    try {
      var f = new File([blob], nome, { type: blob.type });
      if (navigator.canShare && navigator.canShare({ files: [f] })) { navigator.share({ files: [f], title: nome }).catch(function () { }); return; }
    } catch (e) { }
    var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = nome; document.body.appendChild(a); a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 4000);
    toast('Backup salvato nei download.');
  }

  /* ---- collegamento a GitHub */
  function sheetGh() {
    var gh = leggiGh(), repo = gh.repo || repoDefault();
    var h = '<h3>Collegamento a GitHub</h3><p class="lead">Serve solo per il pulsante «Aggiorna»: fa partire lo scarico dei dati su GitHub e aspetta il risultato. Senza collegamento l’app legge comunque i dati che GitHub scarica da solo ogni sera.</p>' +
      '<div class="fields"><div class="full"><label for="g-r">Repository (utente/nome)</label><input id="g-r" autocomplete="off" autocapitalize="off" spellcheck="false" value="' + esc(repo) + '" placeholder="mario/pendolo"></div>' +
      '<div class="full"><label for="g-t">Token (fine-grained, solo questo repository, permesso Actions: lettura e scrittura)</label><input id="g-t" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" value="' + esc(gh.token || '') + '" placeholder="github_pat_…"></div>' +
      '<div class="full"><label for="g-b">Ramo</label><input id="g-b" autocomplete="off" autocapitalize="off" spellcheck="false" value="' + esc(gh.ramo || 'main') + '"></div></div>' +
      '<p class="note" style="margin:0">Il token resta solo su questo telefono e non può leggere né scrivere il codice: può solo far partire e leggere le Actions di quel repository.</p><div id="g-r2"></div>' +
      '<div class="btns"><button data-act="chiudi">Chiudi</button><button data-act="provaGh">Prova</button><button class="pri" data-act="salvaGh">Salva</button></div>' +
      (gh.token ? '<div class="btns"><button class="danger" data-act="togliGh">Scollega</button></div>' : '');
    apriFoglio(h);
  }
  function leggiCampiGh() { return { repo: $('#g-r').value.trim().replace(/^https?:\/\/github\.com\//, '').replace(/\/$/, ''), token: $('#g-t').value.trim(), ramo: $('#g-b').value.trim() || 'main' }; }
  async function provaGh() {
    var gh = leggiCampiGh(), out = $('#g-r2');
    if (!gh.repo || !gh.token) { out.innerHTML = '<div class="banner warn" style="margin-top:8px">Scrivi repository e token.</div>'; return; }
    out.innerHTML = '<div class="banner sim" style="margin-top:8px">Provo…</div>';
    try {
      var r = await ghFetch(gh, '/repos/' + gh.repo + '/actions/workflows/aggiorna.yml');
      out.innerHTML = r.ok ? '<div class="banner ok" style="margin-top:8px">Collegamento funzionante: trovo il flusso «aggiorna.yml».</div>' : '<div class="banner alert" style="margin-top:8px">' + esc(spiegaGh(r)) + '</div>';
    } catch (e) { out.innerHTML = '<div class="banner alert" style="margin-top:8px">Non riesco a raggiungere GitHub. Sei offline?</div>'; }
  }

  /* ---------------------------------------------------------------- eventi */
  document.addEventListener('click', function (e) {
    var b = e.target.closest('[data-act]'); if (!b) { if (e.target.id === 'veil') chiudiFoglio(); return; }
    var a = b.getAttribute('data-act');
    if (a === 'tab') { S.tab = b.getAttribute('data-v'); S.modPrezzi = false; render(); window.scrollTo(0, 0); }
    else if (a === 'vai') { S.tab = b.getAttribute('data-v'); render(); window.scrollTo(0, 0); }
    else if (a === 'chiudi') chiudiFoglio();
    else if (a === 'aggiorna') aggiorna(b.getAttribute('data-sez') || null, b.getAttribute('data-solo') === '1');
    else if (a === 'esciSim') { S.prova = null; S.shock = 0; render(); }
    else if (a === 'shock') { S.shock = parseFloat(b.getAttribute('data-v')); render(); }
    else if (a === 'modPrezzi') { S.modPrezzi = true; render(); }
    else if (a === 'annullaPrezzi') { S.modPrezzi = false; render(); }
    else if (a === 'salvaPrezzi') {
      var n = 0, ok = true, reali = posizioniReali();
      document.querySelectorAll('[data-px]').forEach(function (inp) {
        var id = inp.getAttribute('data-px'), p = reali.filter(function (x) { return x.id === id; })[0], v = parseNum(inp.value);
        if (v == null || v < 0) { ok = false; return; }
        if (p.tipo === 'Liquidità') { if (Math.abs(v - p.qta) > 0.004) { impostaPosizione(id, { qta: v }); n++; } }
        else if (Math.abs(v - p.prezzo) > 1e-9) { impostaPosizione(id, { prezzo: v }); n++; }
      });
      if (!ok) { toast('Controlla i numeri.'); return; }
      S.modPrezzi = false; if (n) salvaU(); render(); toast(n ? n + (n === 1 ? ' prezzo modificato.' : ' prezzi modificati.') : 'Nessuna modifica.');
    }
    else if (a === 'sheetPos') sheetPos(b.getAttribute('data-id'));
    else if (a === 'salvaPos') salvaPos(b.getAttribute('data-id'));
    else if (a === 'regOp') { var def = S.bl.operazioni[parseInt(b.getAttribute('data-i'), 10)]; if (def) sheetOp(def); }
    else if (a === 'regManuale') sheetOp(null, b.getAttribute('data-id'));
    else if (a === 'verso') { S._verso = b.getAttribute('data-v'); document.querySelectorAll('.seg button').forEach(function (x) { x.classList.toggle('on', x.getAttribute('data-v') === S._verso); }); }
    else if (a === 'confermaOp') confermaOp(b.getAttribute('data-isin'), b.getAttribute('data-nome'));
    else if (a === 'annullaOp') annullaOp(b.getAttribute('data-id'));
    else if (a === 'sheetPunteggio') sheetPunteggio();
    else if (a === 'salvaPunteggio') salvaPunteggio();
    else if (a === 'ripristinaPunteggio') { S.U.pendoloManuale = null; salvaU(); chiudiFoglio(); render(); toast('Punteggio calcolato ripristinato.'); }
    else if (a === 'sheetProva') sheetProva();
    else if (a === 'applicaProva') { S.prova = parseFloat($('#pv-r').value); chiudiFoglio(); render(); }
    else if (a === 'sheetImport') sheetImport();
    else if (a === 'leggiImport') leggiImport();
    else if (a === 'confermaImport') confermaImport();
    else if (a === 'sheetGh') sheetGh();
    else if (a === 'provaGh') provaGh();
    else if (a === 'salvaGh') { var g = leggiCampiGh(); if (!g.repo || !g.token) { toast('Scrivi repository e token.'); return; } scriviLS(KEYGH, g); chiudiFoglio(); render(); toast('Collegamento salvato.'); }
    else if (a === 'togliGh') { try { localStorage.removeItem(KEYGH); } catch (er) { } chiudiFoglio(); render(); toast('Scollegato.'); }
    else if (a === 'copiaOps') copiaTesto(tsv(), 'Copiato.');
    else if (a === 'backupCopia') copiaTesto(backupTesto(), 'Backup copiato.');
    else if (a === 'backupSalva') salvaFile(nomeBackup(), backupTesto());
    else if (a === 'reset') {
      apriFoglio('<h3>Annullare le modifiche?</h3><p class="lead">Quantità, costi, prezzi inseriti e punteggio tornano a quelli dell’ultimo file importato. Le operazioni registrate restano nell’elenco, annullate.</p><div class="btns"><button data-act="chiudi">No</button><button class="pri danger" data-act="resetOk">Sì, annulla</button></div>');
    }
    else if (a === 'resetOk') {
      var bs = S.U.base; if (bs) { S.U.posizioni = clona(bs.posizioni); S.U.azioniStato = clona(bs.azioniStato || {}); S.U.contatori = bs.contatori ? clona(bs.contatori) : null; }
      S.U.pendoloManuale = null; S.U.ops.forEach(function (o) { o.annullata = true; });
      salvaU(); chiudiFoglio(); render(); toast('Ripristinato.');
    }
  });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') chiudiFoglio(); if (e.key === 'Enter' && e.target && e.target.matches && e.target.matches('input.px')) { e.target.blur(); } });
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible' && Date.now() - (S.ultimaLettura || 0) > 30 * 60 * 1000 && !(S.agg && S.agg.attivo)) caricaDati().then(render).catch(function () { });
  });

  /* ---------------------------------------------------------------- avvio */
  caricaLocale();
  render();
  S.agg = { attivo: true, msg: 'Scarico i dati…' }; aggiornaBarra();
  caricaDati().then(function (e) { S.agg = { attivo: false, ok: e.dati }; render(); }).catch(function () { S.agg = { attivo: false, ok: false }; render(); });
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(function () { });
  window.__pendolo = S;
})();

</script>
